services:
  softioc:
    extends:
      file: compose.yaml
      service: softioc

  epics2web:
    extends:
      file: compose.yaml
      service: epics2web
    environment:
      # Short, so PingTest runs in seconds
      WEBSOCKET_PING_INTERVAL_SECONDS: 2
      WEBSOCKET_TIMEOUT_SECONDS: 5
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CUSTOM_CRT_URL=http://pki.jlab.org/JLabCA.crt
