services:
  softioc:
    image: codecr.jlab.org/acc/iac/containers/softioc:1
    hostname: softioc
    container_name: softioc
    ports:
      - "5064:5064/tcp"
      - "5065:5065/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
    volumes:
      - ./examples/softioc-db:/db
      - ./examples/softioc-scripts:/scripts
    environment:
      # The record the image's health check reads
      SOFTIOC_HEALTH_PV: HELLO
