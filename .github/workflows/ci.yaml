name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'VERSION'
    tags-ignore:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: jeffersonlab/java-workflows/.github/workflows/unit-ci.yaml@v2

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
    # The JLab CA certificate that build.yaml adds is needed only inside JLab
    - run: docker compose -f build.yaml build --build-arg CUSTOM_CRT_URL=
    - run: docker compose -f build.yaml up -d --no-build --wait --wait-timeout 180
    - run: ./gradlew integrationTest
    - if: failure()
      run: docker compose -f build.yaml logs
    - if: always()
      run: docker compose -f build.yaml down
