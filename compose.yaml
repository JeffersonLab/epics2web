services:
  softioc:
    extends:
      file: deps.yaml
      service: softioc

  epics2web:
    hostname: epics2web
    container_name: epics2web
    environment:
      EPICS_CA_ADDR_LIST: softioc
    depends_on:
      - softioc
    ports:
      - 8080:8080
    healthcheck:
      test: curl -sf http://localhost:8080/epics2web/healthcheck
      interval: 30s
      start_period: 60s
      start_interval: 1s
